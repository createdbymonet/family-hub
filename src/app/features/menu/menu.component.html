<h1 class="visually-hidden">Menu</h1>
<nav class="menu-cards" aria-label="Family Hub tools">
  @for (tool of tools; track tool.path) {
    <article class="menu-card" [class.menu-card--accent]="tool.accent">
      <a class="card-main" [routerLink]="'/' + tool.path">
        <span class="card-icon"><app-icon [name]="tool.icon" /></span>
        <h2>{{ tool.title }}</h2>
        <p>{{ tool.description }}</p>
        <span class="card-caption">{{
          auth.session() ? 'Open your family space' : 'Sign in to share'
        }}</span>
      </a>
      <a class="card-demo" [routerLink]="'/demo/' + tool.path"
        >Try Demo<span class="visually-hidden"> · {{ tool.title }}</span></a
      >
    </article>
  }
</nav>
